name: Build MeowAI Employee Windows EXE

on:
  push:
    branches:
      - meow-ai-employee-v0.5
    paths:
      - 'meow-ai-build/**'
      - '.github/workflows/meow-ai-employee-release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-installer:
    runs-on: windows-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4

      - name: Restore source payload
        shell: pwsh
        run: |
          $parts = Get-ChildItem "meow-ai-build/payload/part*.b64" | Sort-Object Name
          $payload = ""
          foreach ($part in $parts) {
            $payload += Get-Content $part.FullName -Raw
          }
          $bytes = [Convert]::FromBase64String($payload)
          [IO.File]::WriteAllBytes("$PWD\MeowAI-Employee-v0.5.0-source.zip", $bytes)
          New-Item -ItemType Directory -Force -Path "$PWD\build-src" | Out-Null
          Expand-Archive -LiteralPath "$PWD\MeowAI-Employee-v0.5.0-source.zip" -DestinationPath "$PWD\build-src" -Force
          Write-Host "Restored source files:"
          Get-ChildItem "$PWD\build-src"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: build-src/package.json

      - name: Install dependencies
        working-directory: build-src
        run: npm install --no-audit --no-fund

      - name: Run tests
        working-directory: build-src
        run: npm test

      - name: Syntax check
        working-directory: build-src
        run: npm run check

      - name: Build NSIS installer
        working-directory: build-src
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist:win

      - name: Collect installer
        shell: pwsh
        run: |
          $installer = Get-ChildItem "$PWD\build-src\dist" -Filter "*.exe" | Sort-Object Length -Descending | Select-Object -First 1
          if (-not $installer) { throw "Windows installer .exe was not generated." }
          New-Item -ItemType Directory -Force -Path "$PWD\release-files" | Out-Null
          Copy-Item $installer.FullName "$PWD\release-files\MeowAI-Employee-Setup-v0.5.0.exe"
          Get-FileHash "$PWD\release-files\MeowAI-Employee-Setup-v0.5.0.exe" -Algorithm SHA256 | Format-List

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: MeowAI-Employee-Windows-v0.5.0
          path: release-files/MeowAI-Employee-Setup-v0.5.0.exe
          if-no-files-found: error

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "meow-ai-v0.5.0"
          $asset = "$PWD\release-files\MeowAI-Employee-Setup-v0.5.0.exe"
          $notes = @"
          喵喵AI员工 v0.5.0 · 真实数据源版

          新增：
          - 手机端真实数据源中心
          - 神州租车官方开放平台适配层（需商务授权参数）
          - 飞猪租车合作接口桥接层（需业务对接）
          - Excel/CSV 商家真实报价
          - 一嗨公开信息源说明，不把网页动态价冒充实时价
          - 官方源/商家价标识
          - 报价新鲜度与过期提醒
          - 继续支持 AI 顾问 → 多公司比价 → 选车 → 留资成交

          说明：
          未配置神州/飞猪合作参数时，软件会明确显示“待授权/配置”，不会伪造官方实时价格。
          "@

          if (gh release view $tag --repo "${{ github.repository }}" 2>$null) {
            gh release upload $tag $asset --clobber --repo "${{ github.repository }}"
          } else {
            gh release create $tag $asset --repo "${{ github.repository }}" --target "${{ github.sha }}" --title "喵喵AI员工 v0.5.0 · 真实数据源版" --notes $notes
          }
